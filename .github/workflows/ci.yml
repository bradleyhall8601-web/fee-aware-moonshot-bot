name: MoonShotForge CI

on:
  push:
    branches: [main, vercel-supabase-production]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      PUBLIC_BASE_URL: https://moonshotforge.example
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_00000000000000000000000000000000
      TELEGRAM_BOT_TOKEN: test_telegram_token_not_real_000000000000000
      TELEGRAM_WEBHOOK_SECRET: test_webhook_secret_000000000000
      OWNER_TELEGRAM_ID: 1000000000
      ADMIN_PASSWORD: test_admin_password_000000
      ADMIN_SESSION_SECRET: test_session_secret_000000000000000000000000000000
      CRON_SECRET: test_cron_secret_000000000000000000
      DEPLOY_SECRET: test_deploy_secret_000000000000000000
      ENABLE_LIVE_TRADING: "false"
      PAPER_TRADING_ONLY: "true"
      STRICT_DATA_GATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
