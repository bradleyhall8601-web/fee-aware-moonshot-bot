name: Expand Vercel Supabase source

on:
  push:
    branches:
      - vercel-supabase-production
    paths:
      - .source-ready

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Rebuild sanitized deployment source
        shell: bash
        run: |
          set -euo pipefail
          cat .source/chunk-* > /tmp/moonshot-source.b64
          base64 --decode /tmp/moonshot-source.b64 > /tmp/moonshot-source.tgz
          tar -xzf /tmp/moonshot-source.tgz
          rm -rf .source .source-ready .github/workflows/expand-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Vercel and Supabase production source"
          git push origin HEAD:vercel-supabase-production
